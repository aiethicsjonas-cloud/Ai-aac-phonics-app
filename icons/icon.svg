<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background so the icon also works as a "maskable" icon -->
  <rect width="512" height="512" fill="#0b1120"/>
  <!-- Eye outline -->
  <path d="M76 256 C 140 156, 372 156, 436 256 C 372 356, 140 356, 76 256 Z"
        fill="#1e293b" stroke="#fbbf24" stroke-width="20" stroke-linejoin="round"/>
  <!-- Iris with dwell ring -->
  <circle cx="256" cy="256" r="74" fill="none" stroke="#fbbf24" stroke-width="14"
          stroke-dasharray="330 135" stroke-linecap="round" transform="rotate(-90 256 256)"/>
  <circle cx="256" cy="256" r="44" fill="#fbbf24"/>
  <circle cx="240" cy="240" r="12" fill="#fff7d6"/>
  <!-- Sound waves -->
  <path d="M392 150 q 30 -28 0 -56" fill="none" stroke="#a855f7" stroke-width="16" stroke-linecap="round"/>
  <path d="M420 172 q 56 -50 0 -100" fill="none" stroke="#a855f7" stroke-width="16" stroke-linecap="round" opacity="0.7"/>
</svg>
